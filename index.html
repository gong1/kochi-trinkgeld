<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F2A27">
<title>Kochi Team</title>
<meta name="application-name" content="Kochi Team">
<meta name="apple-mobile-web-app-title" content="Kochi Team">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1F2A27">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪙</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --paper:#F5F7F5; --card:#FFFFFF; --ink:#1F2A27; --muted:#66736F; --line:#DCE3DF;
  --celadon:#6E9B8D; --celadon-deep:#2F5E52; --celadon-soft:#E3EEEA;
  --copper:#B06A2C; --copper-soft:#F4E7DB; --glaze:#8AAFC4; --neg:#A2432A;
  --r-s:8px; --r-m:14px;
  --font:"Source Sans 3","PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font:17px/1.45 var(--font);-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--glaze);outline-offset:2px}

header{position:sticky;top:0;z-index:10;background:var(--ink);color:#fff;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;display:flex;align-items:center;gap:10px}
header .brand{font-weight:700;font-size:18px;flex:1;min-width:0}
header .brand small{display:block;font-weight:400;font-size:13px;opacity:.7}
.hbtn{flex:none;white-space:nowrap;background:transparent;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:999px;padding:5px 12px;font-size:14px}
.menu{position:absolute;right:12px;top:calc(100% - 4px);background:var(--card);color:var(--ink);border-radius:var(--r-m);
  box-shadow:0 8px 28px rgba(31,42,39,.18);min-width:190px;overflow:hidden}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:13px 16px;border-bottom:1px solid var(--line)}
.menu button:last-child{border-bottom:0}

main{max-width:560px;margin:0 auto;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 96px)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);
  display:flex;padding:6px 6px calc(env(safe-area-inset-bottom,0px) + 6px)}
nav button{flex:1;background:none;border:0;padding:10px 4px;border-radius:var(--r-s);font-weight:600;color:var(--muted);font-size:15px}
nav button.on{color:var(--celadon-deep);background:var(--celadon-soft)}

h2{font-size:20px;margin:22px 0 10px}
h2:first-child{margin-top:4px}
h3{font-size:16px;margin:18px 0 8px;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:14px}
.row{display:flex;gap:10px;align-items:center}
.row > *{flex:1;min-width:0}
.input{min-width:0}
.sheet{background:var(--card);border-radius:var(--r-m);padding:16px;margin-bottom:14px;border:1px solid var(--line)}

.field{margin-bottom:14px}
.field > label{display:block;font-size:14px;color:var(--muted);margin-bottom:5px}
.input{width:100%;height:50px;border:1.5px solid var(--line);border-radius:var(--r-s);padding:0 14px;background:#fff}
.input:focus{border-color:var(--celadon);outline:none}
.money{position:relative}
.money .input{padding-right:34px;font-size:22px;font-weight:600}
.money::after{content:"€";position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:18px}

.seg{display:flex;background:var(--celadon-soft);border-radius:var(--r-s);padding:3px}
.seg button{flex:1;border:0;background:none;padding:11px 6px;border-radius:6px;font-weight:600;color:var(--celadon-deep)}
.seg.sm button{font-size:14px;padding:10px 2px;min-width:0}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(31,42,39,.15)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 15px;font-weight:600}
.chip.on{background:var(--celadon-deep);border-color:var(--celadon-deep);color:#fff}
.chip.on.bar{background:#3E6B84;border-color:#3E6B84}

.btn{display:block;width:100%;height:52px;border:0;border-radius:var(--r-s);background:var(--ink);color:#fff;font-weight:700;font-size:17px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.warn{background:var(--copper)}
.link{white-space:nowrap;background:none;border:0;padding:4px 0;color:var(--celadon-deep);font-weight:600;font-size:14px}
.link.danger{color:var(--neg)}

/* the split — the one expressive element */
.split{margin:6px 0 4px}
.split .bar{display:flex;height:18px;border-radius:999px;overflow:hidden;background:var(--line)}
.split .bar span{display:block;height:100%;transition:width .25s ease}
.split .legend{margin-top:12px}
.split .li{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.split .li:last-child{border-bottom:0;font-weight:700;font-size:19px}
.split .sw{width:12px;height:12px;border-radius:3px;flex:0 0 12px}
.split .li .lbl{flex:1}
.split .li .sub{color:var(--muted);font-size:14px;font-weight:400}
.c-kitchen{background:var(--copper)} .c-runner{background:var(--celadon)} .c-bar{background:var(--glaze)} .c-you{background:var(--ink)}

.hero{padding:20px 16px;border-radius:var(--r-m);background:var(--card);border:1px solid var(--line);margin-bottom:14px}
.hero .big{font-size:40px;font-weight:700;line-height:1.1}
.hero.pos .big{color:var(--celadon-deep)} .hero.neg .big{color:var(--neg)}
.weeknav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.weeknav button{background:var(--card);border:1px solid var(--line);border-radius:999px;width:40px;height:40px;font-size:18px}
.weeknav .wl{font-weight:700;text-align:center}
.weeknav .wl small{display:block;font-weight:400;color:var(--muted);font-size:13px}

.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden;margin-bottom:14px}
.item{padding:12px 14px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.item .amt{font-weight:700;white-space:nowrap}
.item .meta{font-size:14px;color:var(--muted)}
.item .acts{display:flex;gap:16px;margin-top:4px}
.tag{display:inline-block;font-size:12px;font-weight:600;border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:1px}
.tag.late{background:var(--copper-soft);color:var(--copper)}
.tag.k{background:var(--copper-soft);color:var(--copper)}
.tag.m{background:var(--celadon-soft);color:var(--celadon-deep)}
.tag.off{background:#EEE;color:#888}
.item .amt .lbl{display:block;font-size:11px;font-weight:600;color:var(--muted);text-align:right;margin-top:1px}
.grp{margin:14px 0 6px}
.grp .grp-t{font-weight:700;font-size:16px;color:var(--ink)}
.grp .grp-s{font-size:14px;color:var(--muted);margin-top:2px}
.grp .grp-m{font-size:14px;margin-top:2px}
.item.fading{opacity:.25;transition:opacity .9s}
.grp-sum{font-weight:700;margin:6px 0 10px}
.todo-card{background:var(--copper-soft);border-radius:var(--r-m);padding:10px 12px;margin:0}
.todo-card .todo-t{font-weight:700;color:var(--copper);margin-bottom:4px}
.todo-card .todo-i{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid rgba(176,106,44,.2)}
.todo-card .todo-i:first-of-type{border-top:0}
.todo-card .todo-i span{flex:1}
.todo-card .btn{flex:none;width:auto;height:38px;padding:0 14px;font-size:15px}
.todo-card .todo-n{display:block;padding:8px 0;border-top:1px solid rgba(176,106,44,.2)}
.todo-card .todo-n:first-of-type{border-top:0}
.todo-n .nt-h{font-weight:700;margin-bottom:6px}
.todo-n .nt-r{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;padding:6px 0;border-top:1px dashed rgba(176,106,44,.25)}
.todo-n .nt-r .nt-d{font-weight:700}
.todo-n .nt-r .nt-t{flex-basis:100%}
.todo-n .nt-r.cx .nt-t{color:var(--neg);font-weight:700}
.todo-n .nt-rel{display:inline-block;background:var(--copper);color:#fff;border-radius:6px;padding:0 6px;margin-left:6px;font-size:13px;font-weight:700}
.todo-n .btn{display:block;width:100%;margin-top:8px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:2px 18px;margin-top:6px;font-size:14px;color:var(--muted)}
.kv>div{display:flex;justify-content:space-between;align-items:baseline;gap:8px;min-width:0}
.kv>div>span:first-child{min-width:0;overflow-wrap:anywhere;line-height:1.25}
.kv>div>span.num{color:var(--ink);white-space:nowrap}
.rtri{display:flex;gap:8px}
.rtri button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--muted);font:inherit;cursor:pointer}
.rtri button span{font-weight:700}
.rtri button small{font-size:12px}
.rtri button[data-st=can]{border-color:var(--celadon);color:var(--celadon-deep);background:var(--celadon-soft)}
.rtri button[data-st=main]{border-color:var(--celadon-deep);background:var(--celadon-deep);color:#fff}
.btn.ghost.danger{color:var(--neg);border-color:var(--neg)}
.tag[hidden]{display:none}
.xrow{padding:2px 0}
.xctl{display:flex;align-items:center;gap:10px;margin:2px 0 6px}
.xctl input[type=range]{flex:1;min-width:0;accent-color:var(--celadon-deep);height:28px}
.xb{flex:none;width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);font-size:20px;line-height:1;color:var(--ink);cursor:pointer}
.today-shift .ts-row{padding:6px 0;border-top:1px solid var(--line)}
.today-shift .ts-row:first-of-type{border-top:0}
.task{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--copper);border-radius:var(--r-m);padding:12px 14px;margin-bottom:10px}
.task.bad{border-left-color:var(--neg);background:#FBF0EC}
.task.later{border-left-color:var(--line)}
.task .task-t{font-weight:700;font-size:16px}
.task .task-s{color:var(--muted);font-size:14px;margin-top:3px}
.task .task-b{display:flex;gap:8px;margin-top:10px}
.task .task-b .btn{flex:1}
.task .todo-n{border-top:0;padding-top:4px}
.more{display:flex;flex-direction:column;gap:10px}
.task.okc{border-left-color:var(--celadon)}
.task .sum .li{font-size:14px;padding:3px 0}
.rc-t{width:100%;border-collapse:collapse}
.rc-t th,.rc-t td{padding:6px 4px;text-align:right;border-bottom:1px solid var(--line);font-size:14px}
.rc-t th:first-child{text-align:left;font-weight:600}
.lk-n{display:inline-block;min-width:22px;height:22px;line-height:22px;text-align:center;border-radius:50%;background:var(--paper);font-size:13px;font-weight:700}
.lk-row.next{border-left:4px solid var(--copper)}
.lk-row.wait{opacity:.55}
.lk-row.done .lk-n{background:var(--celadon-soft);color:var(--celadon-deep)}
.lk-cam{display:inline-flex;align-items:center;justify-content:center;width:auto;padding:0 18px;cursor:pointer}
.lk-cam.sm{height:34px;padding:0 12px;font-size:14px}
.lk-cam.busy{opacity:.5;pointer-events:none}
.kv-h{margin-top:8px;font-size:13px;color:var(--muted);border-top:1px dashed var(--line);padding-top:6px}
.toast .tbtn{margin-left:12px;background:#fff;color:var(--ink);border:0;border-radius:999px;padding:4px 12px;font-weight:700}
.viewbar{position:sticky;top:0;z-index:11;background:var(--copper);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 16px;font-weight:700}
.viewbar span{flex:1}
.viewbar button{background:#fff;color:var(--copper);border:0;border-radius:999px;padding:6px 14px;font-weight:700;flex:none}
.rolerow{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line)}
.rolerow .rl{flex:0 0 58px;font-size:14px;font-weight:700;color:var(--muted);padding-top:5px}
.rolerow .rp{flex:1;display:flex;flex-wrap:wrap;gap:6px}
.pchip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;font-size:15px;color:var(--ink);text-align:left}
.pchip .small{margin-left:4px}
.pchip.add{border-style:dashed;color:var(--celadon-deep);font-weight:700;min-width:40px}
.pkchip.on{background:var(--celadon-deep);color:#fff;border-color:var(--celadon-deep)}
.pkchip.no{opacity:.75} .pkchip[disabled]{opacity:.45}
.st{display:inline-block;font-size:12px;font-weight:700;border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:1px;white-space:nowrap}
.st-f{background:#DDEFE6;color:#23624E} .st-b{background:#DCE8F3;color:#24557A}
h3 .ib{border:0;background:none;color:var(--muted);font-size:15px;padding:0 4px;cursor:pointer;vertical-align:0}
.hint{font-size:14px;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:var(--r-s);padding:8px 10px;margin:-2px 0 10px}
h3 .done{font-size:13px;font-weight:700;color:var(--celadon-deep);margin-left:6px}
details.fold{background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);margin-bottom:8px}
details.fold>summary{list-style:none;cursor:pointer;padding:12px 14px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::after{content:'›';color:var(--muted);transition:transform .15s}
details.fold[open]>summary::after{transform:rotate(90deg)}
details.fold>summary .muted{font-weight:400;font-size:14px;margin-left:auto}
details.fold>.inner{padding:0 10px 10px}
details.fold .list{margin-bottom:8px}
.ho{background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);padding:10px 14px;margin-bottom:8px}
.ho .ho-t{font-weight:700;margin-bottom:4px}
.ho .li{display:flex;justify-content:space-between;padding:4px 0;border-top:1px solid var(--line)}
.ho .li:first-of-type{border-top:0}
.cnt-diff[hidden]{display:none}
.sig{display:block;width:100%;height:180px;background:#fff;border:1.5px dashed var(--line);border-radius:var(--r-s);touch-action:none}
.rc-text{white-space:pre-line;background:var(--paper);border-radius:var(--r-s);padding:10px 12px;font-size:15px;margin:6px 0 12px}
.rc-parts .row{margin-bottom:6px}
.tag.bad a,.tag.ok a{color:inherit}
.item.env .who{font-size:18px;font-weight:700}
.item.env .amt{font-size:18px}
.pos{color:var(--celadon-deep)} .negc{color:var(--neg)}
.empty{padding:22px 14px;text-align:center;color:var(--muted)}
.check{display:flex;align-items:center;gap:10px;padding:6px 0}
.check input{width:22px;height:22px;accent-color:var(--celadon-deep)}

.login{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--ink);color:#fff;
  padding:calc(env(safe-area-inset-top,0px) + 28px) 20px calc(env(safe-area-inset-bottom,0px) + 28px)}
.login h1{font-size:30px;margin:28px 0 4px}
.login p{opacity:.7;margin:0 0 22px}
.login .names{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.login h2.grp{font-size:15px;font-weight:600;opacity:.6;margin:18px 0 8px}
.login h2.grp:first-of-type{margin-top:4px}
.idlebar{position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--copper);color:#fff;border-radius:var(--r-m);padding:12px 16px;font-weight:600;text-align:center;box-shadow:0 4px 14px rgba(31,42,39,.25)}
.done{text-align:center;padding-top:12px}
.done .done-mark{width:64px;height:64px;margin:0 auto 6px;border-radius:50%;background:var(--celadon-deep);color:#fff;font-size:34px;line-height:64px}
.done p{margin:6px 0 16px}
.done .sheet{text-align:left}
.done .btn{margin-top:10px}
.infobox{background:var(--celadon-soft);color:var(--celadon-deep);border-radius:var(--r-s);padding:10px 12px;margin:10px 0;font-size:15px}
.login .names button{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);color:#fff;border-radius:var(--r-m);padding:14px 8px;font-weight:600;font-size:17px}
.login .pinbox{max-width:320px}
.login .input{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.25);color:#fff;font-size:28px;letter-spacing:10px;text-align:center;height:60px}
.login .btn{background:var(--celadon);margin-top:14px}
.login .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.25)}
.login .adminlink{margin-top:auto;align-self:flex-start;background:none;border:0;color:rgba(255,255,255,.55);padding:28px 0 0;font-size:15px;text-decoration:underline}
.login label{display:block;margin-bottom:6px;opacity:.75;font-size:14px}
.login label.own{display:flex;gap:12px;align-items:flex-start;opacity:1;font-size:16px;margin:16px 0 0;cursor:pointer}
.login label.own input{width:22px;height:22px;flex:none;margin:1px 0 0;accent-color:var(--celadon)}
.login label.own small{display:block;opacity:.6;font-size:14px;margin-top:2px}
.chip.none{border-style:dashed}
.chip.none.on{background:var(--muted);border-color:var(--muted);border-style:solid;color:#fff}
.seg.sm{overflow-x:auto}
.seg.sm button{flex:1 0 auto;white-space:nowrap}
tr.chg td:last-child{color:var(--copper);font-weight:700}
.tag.pend{background:#FFF1C9;color:#8A6A00}
.mv{background:var(--card);border:1px solid var(--line);border-radius:6px;width:34px;height:30px;padding:0}
label.photo{display:flex;align-items:center;justify-content:center;min-height:110px;border:2px dashed var(--line);border-radius:var(--r-m);background:#fff;color:var(--celadon-deep);font-weight:600;cursor:pointer;overflow:hidden}
label.photo.has{border-style:solid;min-height:0}
label.photo img{display:block;max-width:100%;max-height:220px;object-fit:contain}
.warnbox{background:#FFF1C9;color:#6B5200;border-radius:var(--r-s);padding:10px 12px;margin-bottom:12px;font-size:15px}
.errbox{background:#F8E1DA;color:var(--neg);border-radius:var(--r-s);padding:10px 12px;margin:10px 0;font-size:15px}
.sum .li{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}
.sum .li:last-child{border-bottom:0}
.sum .li.big{font-weight:700;font-size:19px}
.cnt{margin-top:8px}
.cnt .btn{height:50px}
.tag.bad{background:#F8E1DA;color:var(--neg)}
.tag.ok{background:var(--celadon-soft);color:var(--celadon-deep)}
#photoDlg img{display:block;width:100%;margin-bottom:10px;border-radius:6px}
.login .err{color:#F2B39B;min-height:24px;margin-top:10px}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 86px);transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:12px 18px;border-radius:999px;font-weight:600;z-index:50;max-width:90vw;text-align:center;
  box-shadow:0 6px 20px rgba(0,0,0,.2)}
.toast.err{background:var(--neg);text-align:left;line-height:1.45;border-radius:14px;width:min(460px,90vw)}
dialog{border:0;border-radius:var(--r-m);padding:20px;width:min(360px,92vw)}
dialog::backdrop{background:rgba(31,42,39,.5)}
#shiftDlg{width:min(540px,94vw);max-height:90vh;overflow:auto}
#fbDlg{width:min(480px,94vw);max-height:92vh;overflow:auto}
#fbDlg .shot{display:block;width:100%;max-height:260px;object-fit:contain;object-position:top;border:1px solid var(--line);border-radius:var(--r-s);background:var(--paper)}
#fbDlg textarea{width:100%;min-height:110px;resize:vertical;font:inherit;padding:10px 12px}
.dayh{font-weight:700;font-size:17px;margin-bottom:6px}
.avrow{padding:10px 0;border-top:1px solid var(--line)}
.avrow:first-of-type{border-top:0}
.avrow .avtop{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.avrow .avl{flex:1;min-width:120px}
.avb{display:flex;gap:6px}
.avbtn{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 16px;font-weight:600;min-width:74px}
.avbtn.yes.on{background:var(--celadon-deep);border-color:var(--celadon-deep);color:#fff}
.avbtn.no.on{background:var(--neg);border-color:var(--neg);color:#fff}
.avbtn:disabled{opacity:.55}
.avgrid .avday{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.avgrid .avday:first-child{border-top:0}
.banner{max-width:560px;margin:12px auto 0;padding:0 16px}
.banner .infobox{display:flex;align-items:center;gap:12px;margin:0}
.banner .infobox span{flex:1}
.banner .infobox button{flex:none;width:auto;height:40px;padding:0 16px;font-size:15px}
.avgrid .avday .dl{flex:1;font-weight:600}
.avgrid .avbtn{min-width:96px}
.avgrid .avbtn.no:not(.on){background:#DDF1E4;border-color:#8FCBA6;color:#1E6B45}
.avnote{height:42px;margin-top:8px;font-size:15px}
.slotblk{padding:10px 0;border-top:1px solid var(--line)}
.slotblk:first-of-type{border-top:0;padding-top:2px}
.slotblk .sh{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin-bottom:6px}
.shiftrow{display:flex;width:100%;align-items:center;gap:8px;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:var(--r-s);padding:9px 12px;margin-bottom:6px}
.shiftrow .nm{font-weight:600;flex:1}
.addbtn{background:none;border:1.5px dashed var(--line);border-radius:var(--r-s);padding:8px 12px;width:100%;color:var(--celadon-deep);font-weight:600}
.sdgrp{font-size:14px;color:var(--muted);margin:10px 0 6px}
.sdchips{display:flex;flex-wrap:wrap;gap:6px}
.sdchip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-weight:600}
.sdchip small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.sdchip.on{background:var(--celadon-deep);border-color:var(--celadon-deep);color:#fff}
.sdchip.on small{color:#fff}
.sdchip:disabled{opacity:.45}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--muted);font-weight:600}
td.r,th.r{text-align:right}
.scroll{overflow-x:auto}
.loading{padding:40px 0;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function t(k, vars){ let s = (I18N[state.lang] || I18N.zh)[k]; if (s === undefined) s = k; if (vars) for (const [a,b] of Object.entries(vars)) s = s.split('{'+a+'}').join(b); return s; }

function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function today(){ return ymd(new Date()); }
function parseD(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function addDays(s, n){ const d = parseD(s); d.setDate(d.getDate()+n); return ymd(d); }
function mondayOf(s){ const d = parseD(s); d.setDate(d.getDate() - ((d.getDay()+6)%7)); return ymd(d); }
function wdIdx(s){ return (parseD(s).getDay()+6)%7; }
function dm(s){ const d = parseD(s), p = n => String(n).padStart(2, '0'); return state.lang==='de' ? p(d.getDate())+'.'+p(d.getMonth()+1)+'.' : (d.getMonth()+1)+'月'+d.getDate()+'日'; }
function dayLabel(s){ return t('wd')[wdIdx(s)] + ' ' + dm(s); }
function isoWeek(s){ const d = parseD(s); d.setDate(d.getDate()+3-((d.getDay()+6)%7)); const w1 = new Date(d.getFullYear(),0,4); return 1+Math.round(((d-w1)/864e5-3+((w1.getDay()+6)%7))/7); }
function eur(c){ return ((c||0)/100).toLocaleString('de-DE', {style:'currency', currency:'EUR'}); }
function eurInput(c){ return c ? (c/100).toFixed(2).replace('.', ',') : ''; }
function parseEur(s){
  s = String(s||'').trim().replace(/\s|€/g, '');
  if (!s) return 0;
  if (s.includes(',')) s = s.replace(/\./g,'').replace(',', '.');
  if (!/^\d+(\.\d{1,2})?$/.test(s)) return NaN;
  return Math.round(parseFloat(s)*100);
}

function parseSigned(s){
  s = String(s || '').trim();
  const neg = /^-|-$/.test(s);
  const v = parseEur(s.replace(/-/g, ''));
  return isNaN(v) ? NaN : (neg ? -v : v);
}
function money(c){ return (c < 0 ? '-' : '') + (Math.abs(c || 0) / 100).toFixed(2).replace('.', ','); }
function compressImage(file, maxSide, quality){
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const max = maxSide || 1568, s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); resolve(c.toDataURL('image/jpeg', quality || 0.85));
    };
    img.onerror = e => { URL.revokeObjectURL(url); reject(e); };
    img.src = url;
  });
}
// v40：门店清单任务的照片服务（Edge Function「tasks」）
async function callTasks(body){
  const { data, error } = await sb.functions.invoke('tasks', { body: { ...body, token: state.token } });
  if (error){
    let code = 'TASK_FAILED';
    try { const j = await error.context.json(); if (j && j.error) code = j.error; } catch(e){}
    throw new Error(code);
  }
  if (data && data.error) throw new Error(data.error);
  return data;
}
async function callFn(body){
  const { data, error } = await sb.functions.invoke('bon', { body: { ...body, token: state.token } });
  if (error){
    let code = 'BON_FAILED';
    try { const j = await error.context.json(); if (j && j.error) code = j.error; } catch(e){}
    if (code === 'AUTH_REQUIRED'){ if (state.viewAs && state.token === state.viewAs.token){ exitView(); throw new Error(code); } logoutLocal(); render(); }
    throw new Error(code);
  }
  if (data && data.error) throw new Error(data.error);
  return data;
}

function toastAction(msg, label, data){
  document.querySelectorAll('.toast').forEach(n => n.remove());
  const n = document.createElement('div'); n.className = 'toast'; n.setAttribute('role', 'status');
  n.innerHTML = `${esc(msg)}<button class="tbtn" data-act="${esc(data.act)}" data-staff="${esc(data.staff || '')}" data-week="${esc(data.week || '')}">${esc(label)}</button>`;
  document.body.appendChild(n); clearTimeout(toastTimer); toastTimer = setTimeout(() => n.remove(), 5000);
}
function toast(msg, isErr){
  document.querySelectorAll('.toast').forEach(n => n.remove());
  const n = document.createElement('div'); n.className = 'toast' + (isErr ? ' err' : ''); n.textContent = msg;
  n.setAttribute('role', 'status'); document.body.appendChild(n);
  // 报错提示较长：按字数延长显示时间（至少 6 秒），点一下即可关闭
  n.addEventListener('click', () => n.remove());
  clearTimeout(toastTimer); toastTimer = setTimeout(() => n.remove(), isErr ? Math.max(6000, String(msg).length * 110) : 3200);
}

Object.keys(ERR_ZH).forEach(k => { I18N.zh['err_' + k] = ERR_ZH[k]; I18N.de['err_' + k] = ERR_DE[k]; });

function errText(e){
  const m = String(e && e.message || '');
  if (I18N.zh['err_'+m]) return t('err_'+m);
  if (m.includes('staff_name_key')) return t('err_NAME_TAKEN');
  if (m.includes('one_active_kitchen')) return t('err_ONE_KITCHEN');
  if (/fetch|network|Failed/i.test(m)) return t('err_NETWORK');
  return t('err_GENERIC') + (m ? ' [' + m + ']' : '');
}

async function rpc(fn, args){
  const { data, error } = await sb.rpc(fn, args || {});
  if (error){
    const code = String(error.message || '').trim();
    if (code === 'AUTH_REQUIRED'){ if (state.viewAs && state.token === state.viewAs.token){ exitView(); throw new Error(code); } logoutLocal(); render(); }
    if (code === 'MUST_CHANGE_PIN' && state.me){ state.me.must_change_pin = true; authStore().set('me', state.me); render(); }
    throw new Error(code);
  }
  return data;
}

const pushSupported = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
const isIOS = () => /iPhone|iPad|iPod/.test(navigator.userAgent);
const isStandalone = () => window.navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
function b64uToBytes(s){ const p = '='.repeat((4 - s.length % 4) % 4), b = atob((s + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(b, c => c.charCodeAt(0)); }

async function callPush(action, extra){

async function pushOn(){
  const how = k => { const dlg = $('#photoDlg'); dlg.innerHTML = `<h2 style="margin-top:0">${esc(t('push_how_title'))}</h2><div style="margin-bottom:14px">${esc(t(k))}</div><button class="btn" data-act="photo-close">${esc(t('close'))}</button>`; dlg.showModal(); };
  if (!pushSupported()) return how(isIOS() && !isStandalone() ? 'push_how_ios' : 'push_how_unsupported');
  if (!state.personal) return how('push_how_personal');
  const perm = await Notification.requestPermission();
  if (perm !== 'granted') return toast(t('push_denied'), true);
  try {
    const reg = await navigator.serviceWorker.register('sw.js'); await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64uToBytes(VAPID_PUBLIC) });
    const j = sub.toJSON();
    await rpc('push_subscribe', { ...tok(), p_endpoint: j.endpoint, p_p256dh: j.keys.p256dh, p_auth: j.keys.auth, p_user_agent: navigator.userAgent });
    state.pushOn = true; state.menu = false; render(); toast(t('push_on_ok'));
  } catch(e){ toast(errText(e), true); }
}

// v39：同一天、同一家店有几个班（午班 + 晚班）→ 合成一张卡；全部交了才算完成
function viewTasks(){
  const ts = (state.tasks && state.tasks.tasks) || [], out = [], groups = {};
  ts.forEach(k => { if (k.kind === 'bon_shift'){ const g = k.data.date + '|' + k.data.store; (groups[g] = groups[g] || []).push(k); } });
  const order = { overdue: 0, now: 1, later: 2 };
  ts.forEach(k => {
    if (k.kind !== 'bon_shift'){ out.push(k); return; }
    const g = groups[k.data.date + '|' + k.data.store];
    if (g.length === 1){ out.push(k); return; }
    if (g[0] !== k) return;
    const open = g.filter(x => x.status !== 'done').sort((a, b) => order[a.status] - order[b.status]);
    out.push({ kind: 'bon_day', scope: 'personal', day: k.day, due: k.due, status: open.length ? open[0].status : 'done',
      data: { date: k.data.date, store: k.data.store, shifts: g.map(x => ({ ...x.data, done: x.status === 'done' })) } });
  });
  return out;
}

function splitCalc(total, rate, nr, nb){
  const k = Math.round(total * rate.kitchen_pct / 100);
  const re = nr > 0 ? Math.floor(Math.round(total * rate.runner_pct / 100) / nr) : 0;
  const be = nb > 0 ? Math.floor(Math.round(total * rate.bar_pct / 100) / nb) : 0;
  return { k, re, be, s: total - k - re*nr - be*nb };
}

// 选 Runner 时 Runner 组在前、服务其次；选吧台时吧台组在前；组内保持管理员设定的顺序
// 当天已发布排班里，这个班次的 Runner / 吧台（不含自己、只含在职的）
function schedPicks(role){
  const f = state.form, sc = state.bon.sched;
  if (f.entryId || !sc || !sc.published) return [];
  return (sc[role === 'runner' ? 'runners' : 'bars'] || []).filter(id => id !== state.me.id && state.staff.some(s => s.id === id));
}
function dayPicks(role){
  const f = state.form, b = state.bon;
  if (f.entryId || !b.read || !b.dayHelp) return [];
  return (b.dayHelp[role === 'runner' ? 'runners' : 'bars'] || []).filter(id => id !== state.me.id && state.staff.some(s => s.id === id));
}
// 排序：今天同事已选的 > 近 30 天被选天数多的 > 主岗位 > 管理员设定的顺序
function orderedFor(role, list){
  const pri = role === 'runner' ? { runner: 0, service: 1, bar: 2 } : { bar: 0, service: 1, runner: 2 };
  const freq = (state.hstats && state.hstats[role]) || {}, today = dayPicks(role), plan = schedPicks(role);
  const key = s => [plan.includes(s.id) ? 0 : today.includes(s.id) ? 1 : 2, -(freq[s.id] || 0), pri[mainRoleOf(s.id)]];
  return list.map((s, i) => ({ s, i, k: key(s) })).sort((a, b) =>
    (a.k[0] - b.k[0]) || (a.k[1] - b.k[1]) || (a.k[2] - b.k[2]) || (a.i - b.i)).map(x => x.s);
}
function chipsHTML(role){
  const f = state.form, sel = role === 'runner' ? f.runners : f.bars;

async function readBon(){

  catch(e){ err = errText(e); }
  if (state.bon !== b || my !== b.seq) return;   // 照片已更换，丢弃旧结果
  if (r){
    const d = r.result.derived || {};

    if (!(r.checks && r.checks.ok) && d.store && d.user_id && d.report_id) b.fails++;
    if (d.work_date) state.form.date = d.work_date;
    if (d.work_date && d.store){ try { b.dayHelp = await rpc('day_helpers', { ...tok(), p_date: d.work_date, p_store: d.store }); } catch(e){} }
    // 当天有已发布的排班：自动选上这个班次的 Runner / 吧台（员工还没自己选过时才填；排班里没排的岗位不自动填）
    if (d.work_date && d.store){ try { b.sched = await rpc('sched_bon_helpers', { ...tok(), p_date: d.work_date, p_store: d.store }); } catch(e){ b.sched = null; } }
    if (state.bon !== b || my !== b.seq) return;
    const f = state.form;
    [['runner', 'runners', 'autoRunners'], ['bar', 'bars', 'autoBars']].forEach(([role, key, flag]) => {
      if (f[key] !== null && !f[flag]) return;
      const ids = schedPicks(role), sc = b.sched;

      else if (sc && sc.published && sc['none_' + role]){ f[key] = []; f[flag] = true; }   // 这个岗位的人全是兼岗的服务员
      else if (f[flag]){ f[key] = null; f[flag] = false; }

}

function envelopeBlockHTML(entries, env){
  const info = {}, groups = {};
  const key = (d, st) => d + '|' + st;
  const grp = (d, st) => groups[key(d, st)] = groups[key(d, st)] || { date: d, store: st, entries: [], sched: null };
  (env && env.groups || []).forEach(x => { grp(x.date, x.store).sched = x; (x.entries || []).forEach(i => info[i.entry_id] = i); });
  entries.forEach(e => grp(e.date, e.store).entries.push(e));
  const isTodo = e => e.is_bon && e.counted_cents !== e.wallet_cents;
  const nTodo = entries.filter(isTodo).length;
  // 同一个人的几个班合成一条：「Anna 午班+晚班」
  const people = (list, fmt) => {
    const m = {};
    list.forEach(x => { (m[x.staff_id] = m[x.staff_id] || { name: x.name, slots: [], x }).slots.push(x.slot); });
    return Object.values(m).map(p => fmt ? fmt(p) : p.name + ' ' + slotsText(p.slots)).join('、');
  };
  // 组内顺序：员工顺序 → 午班在前 → 提交先后
  const staffPos = {}; (state.staff || []).forEach((x, n) => staffPos[x.id] = n);
  const firstSlot = i => i && (i.slots || []).length ? (i.slots.some(x => x.slot === 'lunch') ? 0 : 1) : 2;
  const cardOrder = (a, b) => { const ia = info[a.entry_id], ib = info[b.entry_id];
    const pa = ia ? (staffPos[ia.server_id] ?? 999) : 999, pb = ib ? (staffPos[ib.server_id] ?? 999) : 999;
    return pa - pb || firstSlot(ia) - firstSlot(ib) || String(ia && ia.created_at).localeCompare(String(ib && ib.created_at)); };
  const html = Object.values(groups).sort(byDateStore).map(g => {
    const todo = g.entries.filter(isTodo).sort(cardOrder), bons = g.entries.filter(e => e.is_bon), sc = g.sched;
    if (!todo.length) return '';   // 没有信封要点的组不列（还没交的人在页面顶部的提醒里）
    let line = '', miss = '', other = '';
    if (sc && sc.published){
      const sh = sc.shifts || [], missing = sh.filter(x => !x.covered);
      const elsewhere = sh.filter(x => x.covered && !(x.covered_stores || []).includes(g.store));
      line = sh.length ? t('env_line', { s: sh.length, c: sh.length - missing.length, n: bons.length }) : t('env_line_noshift', { n: bons.length });
      if (missing.length) miss = `<div class="grp-m ${sc.overdue ? 'negc' : 'muted'}">${esc(t(sc.overdue ? 'env_missing_late' : 'env_missing', { list: people(missing) }))}</div>`;
      if (elsewhere.length) other = `<div class="grp-m muted">${esc(t('env_elsewhere', { list: people(elsewhere,
        p => t('env_elsewhere_one', { n: p.name + ' ' + slotsText(p.slots), s: (p.x.covered_stores || []).join(' / ') })) }))}</div>`;
      if (!todo.length && !missing.length && !elsewhere.length) return '';
    } else {
      if (!todo.length) return '';
      if (sc) line = t('env_line_nosched', { n: bons.length });
    }
    return `<div class="grp"><div class="grp-t">${esc(dayLabel(g.date))}${storeTag(g.store)}${!todo.length && bons.length ? ` <span class="tag ok" title="${esc(t('env_counted_all'))}">✓</span>` : ''}</div>
        ${line ? `<div class="grp-s">${esc(line)}</div>` : ''}${miss}${other}</div>
      ${todo.length ? `<div class="list">${todo.map(e => envelopeCard(e, info[e.entry_id], g.store)).join('')}</div>` : ''}`;
  }).join('');
  const allDone = !nTodo && entries.some(e => e.is_bon);
  if (!nTodo && !allDone) return '';
  const todoAll = entries.filter(isTodo), counted = entries.filter(e => e.is_bon && !isTodo(e)).sort(byDateStore);
  return h3i(esc(t('to_count', { n: nTodo })) + (allDone ? `<span class="done" title="${esc(t('all_counted'))}">✓</span>` : ''), nTodo ? t('to_count_hint') : '')
    + (nTodo ? `<div class="grp-sum">${esc(t('env_sum', { n: nTodo, x: eur(todoAll.reduce((a, e) => a + e.wallet_cents, 0)) }))}</div>` : '')
    + html
    + (counted.length ? `<details class="fold"><summary>${esc(t('env_done_grp', { n: counted.length }))}</summary><div class="inner"><div class="list">${counted.map(e => entryItem(e, { head: 'server' })).join('')}</div></div></details>` : '');
}

async function saveEntry(){
  const f = state.form, card = parseEur(f.card), cash = parseEur(f.cash);
  if (isNaN(card) || isNaN(cash)) return toast(t('bad_amount'), true);
  if (card + cash <= 0) return toast(t('need_amount'), true);
  if (f.runners === null) return toast(t('pick_runner'), true);
  if (f.bars === null) return toast(t('pick_bar'), true);
  if (f.entryId && !f.direct && !f.reason.trim()) return toast(t('err_REASON_REQUIRED'), true);
  const btn = document.querySelector('[data-act="entry-save"]'); if (btn) btn.disabled = true;
  try {
    const r = await rpc('submit_entry', { ...tok(), p_date: f.date, p_store: f.store, p_card_cents: card, p_cash_cents: cash,
      p_runner_ids: f.runners, p_bar_ids: f.bars, p_server_id: f.server, p_entry_id: f.entryId, p_reason: f.reason.trim() || null });
    LS.set('store', f.store);
    const keep = { date: f.date, store: f.store };
    state.form = { ...blankForm(), ...keep }; await loadMyBon();
    toast(r && r.status === 'pending' ? t('request_sent') : t('saved')); render();

}

function sigInit(){
  const c = $('#sig'); if (!c) return;
  const dpr = window.devicePixelRatio || 1, r = c.getBoundingClientRect();

  const g = c.getContext('2d'); g.scale(dpr, dpr); g.lineWidth = 2.4; g.lineCap = 'round'; g.lineJoin = 'round'; g.strokeStyle = g.fillStyle = '#111';
  state.sigInk = 0; let last = null;
  const pt = e => { const b = c.getBoundingClientRect(); return { x: e.clientX - b.left, y: e.clientY - b.top }; };
  c.onpointerdown = e => { e.preventDefault(); c.setPointerCapture(e.pointerId); last = pt(e); g.beginPath(); g.arc(last.x, last.y, 1.2, 0, 7); g.fill(); };
  c.onpointermove = e => { if (!last) return; const p = pt(e); g.beginPath(); g.moveTo(last.x, last.y); g.lineTo(p.x, p.y); g.stroke(); last = p; state.sigInk++; };
  c.onpointerup = c.onpointercancel = () => { last = null; };
}

// 发放列表分组：待发放（金额大在前）→ 已发放等签收（等得久在前）→ 已完成（折叠）→ 无需发放（折叠）
function distGroupsHTML(dist, row, signed, days){
  const L = dist.lines, abs = l => Math.abs(l.payout_euros), byPaid = (a, b) => String(a.done_at).localeCompare(String(b.done_at));
  const pend = L.filter(l => l.payout_euros !== 0 && !l.done).sort((a, b) => abs(b) - abs(a));
  const isDone = l => !dist.required || signed(l);
  const wait = L.filter(l => l.payout_euros !== 0 && l.done && !isDone(l)).sort(byPaid);
  const done = L.filter(l => l.payout_euros !== 0 && l.done && isDone(l)).sort(byPaid);
  const zero = L.filter(l => l.payout_euros === 0);
  const outs = pend.filter(l => l.payout_euros > 0), ins = pend.filter(l => l.payout_euros < 0), sum = a => eur(a.reduce((x, l) => x + abs(l) * 100, 0));
  const head = pend.length ? [outs.length ? t('pay_sum', { n: outs.length, x: sum(outs) }) : '', ins.length ? t('pay_sum_in', { n: ins.length, x: sum(ins) }) : ''].filter(Boolean).join(' · ') : t('pay_all_done');
  const list = a => `<div class="list">${a.map(row).join('')}</div>`;
  const fold = (title, a) => a.length ? `<details class="fold"><summary>${esc(title)}</summary><div class="inner">${list(a)}</div></details>` : '';
  const payers = state.payers || [];
  if (state.payer === undefined) state.payer = payers.length ? payers[0].id : '';   // v41：默认小费管理员

  return `<div class="grp-sum ${pend.length ? '' : 'pos'}">${esc(head)}</div>` + payerSel

// 日志详情：写成看得懂的一行（金额按欧元、周按 KW、日期统一格式），不显示内部编号
function auditDetail(d){
  if (!d || typeof d !== 'object') return '';
  const isId = v => typeof v === 'string' && /^[0-9a-f]{8}-[0-9a-f]{4}-/i.test(v);
  const skip = (k, v) => k === 'id' || /_ids?$/.test(k) || isId(v);
  const lbl = k => { const x = t('ad_' + k); return x === 'ad_' + k ? k : x; };
  const day = v => /^\d{4}-\d{2}-\d{2}/.test(String(v)) ? String(v).slice(0, 10) : null;
  const val = (k, v) => {
    if (v === null || v === undefined || v === '') return '–';
    if (typeof v === 'boolean') return t(v ? 'ad_yes' : 'ad_no');
    if (/_cents$/.test(k) || k === 'counted' || k === 'expected') return eur(v);
    if (k === 'payout_euros') return eur(v * 100);
    if (k === 'week' && day(v)) return 'KW ' + isoWeek(day(v));
    if ((k === 'date' || k === 'valid_from') && day(v)) return dayLabel(day(v));
    if (k === 'role') return t('role_' + v);
    if (k === 'slot') return slotLabel(v);
    if (k === 'method') return t('tag_counted_' + v);
    if (Array.isArray(v)) return v.filter(x => typeof x !== 'object' && !isId(x)).join('、') || '–';
    if (typeof v === 'object') return '(' + Object.entries(v).filter(([kk, vv]) => !skip(kk, vv) && typeof vv !== 'object').map(([kk, vv]) => lbl(kk) + ' ' + val(kk, vv)).join(' · ') + ')';
    return String(v);
  };
  const out = Object.entries(d).filter(([k, v]) => !skip(k, v)).map(([k, v]) => lbl(k) + ': ' + val(k, v)).join(' · ');
  return out.length > 300 ? out.slice(0, 300) + '…' : out;
}

function loadScript(src){
  return new Promise((ok, bad) => { if (document.querySelector(`script[src="${src}"]`) && window.html2canvas) return ok();
    const el = document.createElement('script'); el.src = src; el.onload = ok; el.onerror = bad; document.head.appendChild(el); });
}
async function fbCapture(){
  // 截当前屏幕可见区域，压缩成宽度不超过 900px 的 JPEG
  await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
  const c = await window.html2canvas(document.body, { x: window.scrollX, y: window.scrollY, width: window.innerWidth,
    height: window.innerHeight, windowWidth: document.documentElement.clientWidth, scale: 1, useCORS: true, logging: false, ignoreElements: n => n.classList && (n.classList.contains('toast') || n.classList.contains('idlebar')),
    backgroundColor: getComputedStyle(document.body).backgroundColor || '#fff' });
  const k = Math.min(1, 900 / c.width), out = document.createElement('canvas');
  out.width = Math.round(c.width * k); out.height = Math.round(c.height * k);
  out.getContext('2d').drawImage(c, 0, 0, out.width, out.height);
  return out.toDataURL('image/jpeg', 0.7);
}

// 全系统统一：「周一 9月28日 23:10」/「Mo 28.09. 23:10」（柏林时间），不是今年的前面加年份
function fmtDateTime(iso){
  if (!iso) return '';
  const d = new Date(iso);
  const day = d.toLocaleDateString('sv-SE', { timeZone: 'Europe/Berlin' });   // YYYY-MM-DD
  const ts = d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Berlin' });
  const y = day.slice(0, 4), yr = y !== today().slice(0, 4) ? (state.lang === 'de' ? y + ' ' : y + '年 ') : '';
  return yr + dayLabel(day) + ' ' + ts;
}

// 员工 90 秒无操作自动退出；管理员和小费管理员 5 分钟
const idleLimit = () => { const m = state.viewAs ? state.viewAs.adminMe : (state.me || {}); return (m.is_admin || m.is_tip_manager || m.is_scheduler) ? 300 : 90; };
let lastAct = Date.now(), hiddenAt = null;
function hideIdleBar(){ document.querySelectorAll('.idlebar').forEach(n => n.remove()); }
function showIdleBar(n){
  let bar = document.querySelector('.idlebar');
  if (!bar){ bar = document.createElement('div'); bar.className = 'idlebar'; bar.setAttribute('role', 'status'); document.body.appendChild(bar); }
  bar.textContent = t('idle_warn', { n });
}
['pointerdown', 'keydown', 'input', 'change', 'scroll', 'touchstart'].forEach(ev =>
  document.addEventListener(ev, () => { lastAct = Date.now(); hideIdleBar(); }, { passive: true, capture: true }));
document.addEventListener('visibilitychange', () => {
  if (document.hidden){ hiddenAt = Date.now(); return; }
  const away = hiddenAt ? (Date.now() - hiddenAt) / 1000 : 0; hiddenAt = null;
  if (state.token && !state.personal && away > idleLimit()) signOut(); else lastAct = Date.now();
});
setInterval(() => {
  if (document.hidden) return;
  const idle = (Date.now() - lastAct) / 1000;
  if (!state.token){
    // 选了名字却没输 PIN：60 秒后回到名单
    if ((state.loginPick || state.loginAdmin) && idle > 60){ state.loginPick = null; state.loginAdmin = false; state.loginErr = ''; renderLogin(); }
    return;
  }
  if (state.personal || (state.bon && state.bon.busy)){ lastAct = Date.now(); return; } // 正在识别单据时不计时
  const left = idleLimit() - idle;
  if (left <= 0) signOut(); else if (left <= 15) showIdleBar(Math.ceil(left));
}, 1000);
