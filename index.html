<style>
:root{
  --paper:#F5F7F5; --card:#FFFFFF; --ink:#1F2A27; --muted:#66736F; --line:#DCE3DF;
  --celadon:#6E9B8D; --celadon-deep:#2F5E52; --celadon-soft:#E3EEEA;
  --copper:#B06A2C; --copper-soft:#F4E7DB; --glaze:#8AAFC4; --neg:#A2432A;
  --r-s:8px; --r-m:14px;
  --font:"Source Sans 3","PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font:17px/1.45 var(--font);-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--glaze);outline-offset:2px}

header{position:sticky;top:0;z-index:10;background:var(--ink);color:#fff;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;display:flex;align-items:center;gap:10px}
header .brand{font-weight:700;font-size:18px;flex:1;min-width:0}
header .brand small{display:block;font-weight:400;font-size:13px;opacity:.7}
.hbtn{flex:none;white-space:nowrap;background:transparent;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:999px;padding:5px 12px;font-size:14px}
.menu{position:absolute;right:12px;top:calc(100% - 4px);background:var(--card);color:var(--ink);border-radius:var(--r-m);
  box-shadow:0 8px 28px rgba(31,42,39,.18);min-width:190px;overflow:hidden}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:13px 16px;border-bottom:1px solid var(--line)}
.menu button:last-child{border-bottom:0}

main{max-width:560px;margin:0 auto;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 96px)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);
  display:flex;padding:6px 6px calc(env(safe-area-inset-bottom,0px) + 6px)}
nav button{flex:1;background:none;border:0;padding:10px 4px;border-radius:var(--r-s);font-weight:600;color:var(--muted);font-size:15px}
nav button.on{color:var(--celadon-deep);background:var(--celadon-soft)}

h2{font-size:20px;margin:22px 0 10px}
h2:first-child{margin-top:4px}
h3{font-size:16px;margin:18px 0 8px;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:14px}
.row{display:flex;gap:10px;align-items:center}
.row > *{flex:1;min-width:0}
.input{min-width:0}
.sheet{background:var(--card);border-radius:var(--r-m);padding:16px;margin-bottom:14px;border:1px solid var(--line)}

.field{margin-bottom:14px}
.field > label{display:block;font-size:14px;color:var(--muted);margin-bottom:5px}
.input{width:100%;height:50px;border:1.5px solid var(--line);border-radius:var(--r-s);padding:0 14px;background:#fff}
.input:focus{border-color:var(--celadon);outline:none}
.money{position:relative}
.money .input{padding-right:34px;font-size:22px;font-weight:600}
.money::after{content:"€";position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:18px}

.seg{display:flex;background:var(--celadon-soft);border-radius:var(--r-s);padding:3px}
.seg button{flex:1;border:0;background:none;padding:11px 6px;border-radius:6px;font-weight:600;color:var(--celadon-deep)}
.seg.sm button{font-size:14px;padding:10px 2px;min-width:0}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(31,42,39,.15)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 15px;font-weight:600}
.chip.on{background:var(--celadon-deep);border-color:var(--celadon-deep);color:#fff}
.chip.on.bar{background:#3E6B84;border-color:#3E6B84}

.btn{display:block;width:100%;height:52px;border:0;border-radius:var(--r-s);background:var(--ink);color:#fff;font-weight:700;font-size:17px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.warn{background:var(--copper)}
.link{white-space:nowrap;background:none;border:0;padding:4px 0;color:var(--celadon-deep);font-weight:600;font-size:14px}
.link.danger{color:var(--neg)}

/* the split — the one expressive element */
.split{margin:6px 0 4px}
.split .bar{display:flex;height:18px;border-radius:999px;overflow:hidden;background:var(--line)}
.split .bar span{display:block;height:100%;transition:width .25s ease}
.split .legend{margin-top:12px}
.split .li{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.split .li:last-child{border-bottom:0;font-weight:700;font-size:19px}
.split .sw{width:12px;height:12px;border-radius:3px;flex:0 0 12px}
.split .li .lbl{flex:1}
.split .li .sub{color:var(--muted);font-size:14px;font-weight:400}
.c-kitchen{background:var(--copper)} .c-runner{background:var(--celadon)} .c-bar{background:var(--glaze)} .c-you{background:var(--ink)}

.hero{padding:20px 16px;border-radius:var(--r-m);background:var(--card);border:1px solid var(--line);margin-bottom:14px}
.hero .big{font-size:40px;font-weight:700;line-height:1.1}
.hero.pos .big{color:var(--celadon-deep)} .hero.neg .big{color:var(--neg)}
.weeknav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.weeknav button{background:var(--card);border:1px solid var(--line);border-radius:999px;width:40px;height:40px;font-size:18px}
.weeknav .wl{font-weight:700;text-align:center}
.weeknav .wl small{display:block;font-weight:400;color:var(--muted);font-size:13px}

.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden;margin-bottom:14px}
.item{padding:12px 14px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.item .amt{font-weight:700;white-space:nowrap}
.item .meta{font-size:14px;color:var(--muted)}
.item .acts{display:flex;gap:16px;margin-top:4px}
.tag{display:inline-block;font-size:12px;font-weight:600;border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:1px}
.tag.late{background:var(--copper-soft);color:var(--copper)}
.tag.k{background:var(--copper-soft);color:var(--copper)}
.tag.m{background:var(--celadon-soft);color:var(--celadon-deep)}
.tag.off{background:#EEE;color:#888}
.pos{color:var(--celadon-deep)} .negc{color:var(--neg)}
.empty{padding:22px 14px;text-align:center;color:var(--muted)}
.check{display:flex;align-items:center;gap:10px;padding:6px 0}
.check input{width:22px;height:22px;accent-color:var(--celadon-deep)}

.login{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--ink);color:#fff;
  padding:calc(env(safe-area-inset-top,0px) + 28px) 20px calc(env(safe-area-inset-bottom,0px) + 28px)}
.login h1{font-size:30px;margin:28px 0 4px}
.login p{opacity:.7;margin:0 0 22px}
.login .names{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.login h2.grp{font-size:15px;font-weight:600;opacity:.6;margin:18px 0 8px}
.login h2.grp:first-of-type{margin-top:4px}
.idlebar{position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--copper);color:#fff;border-radius:var(--r-m);padding:12px 16px;font-weight:600;text-align:center;box-shadow:0 4px 14px rgba(31,42,39,.25)}
.done{text-align:center;padding-top:12px}
.done .done-mark{width:64px;height:64px;margin:0 auto 6px;border-radius:50%;background:var(--celadon-deep);color:#fff;font-size:34px;line-height:64px}
.done p{margin:6px 0 16px}
.done .sheet{text-align:left}
.done .btn{margin-top:10px}
.infobox{background:var(--celadon-soft);color:var(--celadon-deep);border-radius:var(--r-s);padding:10px 12px;margin:10px 0;font-size:15px}
.login .names button{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);color:#fff;border-radius:var(--r-m);padding:14px 8px;font-weight:600;font-size:17px}
.login .pinbox{max-width:320px}
.login .input{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.25);color:#fff;font-size:28px;letter-spacing:10px;text-align:center;height:60px}
.login .btn{background:var(--celadon);margin-top:14px}
.login .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.25)}
.login .adminlink{margin-top:auto;align-self:flex-start;background:none;border:0;color:rgba(255,255,255,.55);padding:28px 0 0;font-size:15px;text-decoration:underline}
.login label{display:block;margin-bottom:6px;opacity:.75;font-size:14px}
.login label.own{display:flex;gap:12px;align-items:flex-start;opacity:1;font-size:16px;margin:16px 0 0;cursor:pointer}
.login label.own input{width:22px;height:22px;flex:none;margin:1px 0 0;accent-color:var(--celadon)}
.login label.own small{display:block;opacity:.6;font-size:14px;margin-top:2px}
.chip.none{border-style:dashed}
.chip.none.on{background:var(--muted);border-color:var(--muted);border-style:solid;color:#fff}
.seg.sm{overflow-x:auto}
.seg.sm button{flex:1 0 auto;white-space:nowrap}
tr.chg td:last-child{color:var(--copper);font-weight:700}
.tag.pend{background:#FFF1C9;color:#8A6A00}
.mv{background:var(--card);border:1px solid var(--line);border-radius:6px;width:34px;height:30px;padding:0}
label.photo{display:flex;align-items:center;justify-content:center;min-height:110px;border:2px dashed var(--line);border-radius:var(--r-m);background:#fff;color:var(--celadon-deep);font-weight:600;cursor:pointer;overflow:hidden}
label.photo.has{border-style:solid;min-height:0}
label.photo img{display:block;max-width:100%;max-height:220px;object-fit:contain}
.warnbox{background:#FFF1C9;color:#6B5200;border-radius:var(--r-s);padding:10px 12px;margin-bottom:12px;font-size:15px}
.errbox{background:#F8E1DA;color:var(--neg);border-radius:var(--r-s);padding:10px 12px;margin:10px 0;font-size:15px}
.sum .li{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}
.sum .li:last-child{border-bottom:0}
.sum .li.big{font-weight:700;font-size:19px}
.cnt{margin-top:8px}
.cnt .btn{height:50px}
.tag.bad{background:#F8E1DA;color:var(--neg)}
.tag.ok{background:var(--celadon-soft);color:var(--celadon-deep)}
#photoDlg img{display:block;width:100%;margin-bottom:10px;border-radius:6px}
.login .err{color:#F2B39B;min-height:24px;margin-top:10px}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 86px);transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:12px 18px;border-radius:999px;font-weight:600;z-index:50;max-width:90vw;text-align:center;
  box-shadow:0 6px 20px rgba(0,0,0,.2)}
.toast.err{background:var(--neg)}
dialog{border:0;border-radius:var(--r-m);padding:20px;width:min(360px,92vw)}
dialog::backdrop{background:rgba(31,42,39,.5)}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--muted);font-weight:600}
td.r,th.r{text-align:right}
.scroll{overflow-x:auto}
.loading{padding:40px 0;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

// ============ 工具 ============
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
// 登录信息只存在本次浏览器会话里（共用设备上关掉页面即失效）
const SS = {
  get(k, d){ try{ const v = sessionStorage.getItem(k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ sessionStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ sessionStorage.removeItem(k); }catch(e){} }
};
// 个人设备：登录保存在 localStorage，一直有效；店里设备：只存在本次会话里
if (!LS.get('personal', false)){ LS.del('token'); LS.del('me'); } // 清除旧版本长期保存的登录
const authStore = () => state.personal ? LS : SS;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function t(k, vars){ let s = (I18N[state.lang] || I18N.zh)[k]; if (s === undefined) s = k; if (vars) for (const [a,b] of Object.entries(vars)) s = s.replace('{'+a+'}', b); return s; }

function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function today(){ return ymd(new Date()); }
function parseD(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function addDays(s, n){ const d = parseD(s); d.setDate(d.getDate()+n); return ymd(d); }
function mondayOf(s){ const d = parseD(s); d.setDate(d.getDate() - ((d.getDay()+6)%7)); return ymd(d); }
function wdIdx(s){ return (parseD(s).getDay()+6)%7; }
function dm(s){ const d = parseD(s); return state.lang==='de' ? d.getDate()+'.'+(d.getMonth()+1)+'.' : (d.getMonth()+1)+'月'+d.getDate()+'日'; }
function dayLabel(s){ return t('wd')[wdIdx(s)] + ' ' + dm(s); }
function isoWeek(s){ const d = parseD(s); d.setDate(d.getDate()+3-((d.getDay()+6)%7)); const w1 = new Date(d.getFullYear(),0,4); return 1+Math.round(((d-w1)/864e5-3+((w1.getDay()+6)%7))/7); }
function eur(c){ return ((c||0)/100).toLocaleString('de-DE', {style:'currency', currency:'EUR'}); }
function eurInput(c){ return c ? (c/100).toFixed(2).replace('.', ',') : ''; }
function parseEur(s){
  s = String(s||'').trim().replace(/\s|€/g, '');
  if (!s) return 0;
  if (s.includes(',')) s = s.replace(/\./g,'').replace(',', '.');
  if (!/^\d+(\.\d{1,2})?$/.test(s)) return NaN;
  return Math.round(parseFloat(s)*100);
}

function parseSigned(s){
  s = String(s || '').trim();
  const neg = /^-|-$/.test(s);
  const v = parseEur(s.replace(/-/g, ''));
  return isNaN(v) ? NaN : (neg ? -v : v);
}
function money(c){ return (c < 0 ? '-' : '') + (Math.abs(c || 0) / 100).toFixed(2).replace('.', ','); }
function compressImage(file){
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const max = 1568, s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); resolve(c.toDataURL('image/jpeg', 0.85));
    };

function splitCalc(total, rate, nr, nb){
  const k = Math.round(total * rate.kitchen_pct / 100);
  const re = nr > 0 ? Math.floor(Math.round(total * rate.runner_pct / 100) / nr) : 0;
  const be = nb > 0 ? Math.floor(Math.round(total * rate.bar_pct / 100) / nb) : 0;
  return { k, re, be, s: total - k - re*nr - be*nb };
}

function dayPicks(role){
  const f = state.form, b = state.bon;
  if (f.entryId || !b.read || !b.dayHelp) return [];
  return (b.dayHelp[role === 'runner' ? 'runners' : 'bars'] || []).filter(id => id !== state.me.id && state.staff.some(s => s.id === id));
}
// 排序：今天同事已选的 > 近 30 天被选天数多的 > 主岗位 > 管理员设定的顺序
function orderedFor(role, list){
  const pri = role === 'runner' ? { runner: 0, service: 1, bar: 2 } : { bar: 0, service: 1, runner: 2 };
  const freq = (state.hstats && state.hstats[role]) || {}, today = dayPicks(role);
  const key = s => [today.includes(s.id) ? 0 : 1, -(freq[s.id] || 0), pri[mainRoleOf(s.id)]];
  return list.map((s, i) => ({ s, i, k: key(s) })).sort((a, b) =>
    (a.k[0] - b.k[0]) || (a.k[1] - b.k[1]) || (a.k[2] - b.k[2]) || (a.i - b.i)).map(x => x.s);
}

  const today = dayPicks(role), sameOn = today.length && !!sel && sel.length === today.length && today.every(has);
  const sameBtn = today.length ? `<button type="button" class="chip ${role==='bar'?'bar':''} ${sameOn?'on':''}" aria-pressed="${!!sameOn}" data-act="chip-day" data-role="${role}" style="flex-basis:100%;text-align:left">${esc(t('same_today', { n: today.map(staffName).join('、') }))}</button>` : '';

async function readBon(){
  const b = state.bon; if (!b.top || !b.bottom) return;
  const my = ++b.seq;
  b.busy = true; b.readErr = null; b.read = null; b.dayHelp = null; b.ack = false; refreshBonParts();
  let r = null, err = null;
  try { r = await callFn({ action: 'read', top: b.top.split(',')[1], bottom: b.bottom.split(',')[1] }); }
  catch(e){ err = errText(e); }
  if (state.bon !== b || my !== b.seq) return;   // 照片已更换，丢弃旧结果
  if (r){
    const d = r.result.derived || {};
    b.read = r;
    if (!(r.checks && r.checks.ok) && d.store && d.user_id) b.fails++;
    if (d.work_date) state.form.date = d.work_date;
    if (d.work_date && d.store){ try { b.dayHelp = await rpc('day_helpers', { ...tok(), p_date: d.work_date, p_store: d.store }); } catch(e){} }
    if (state.bon !== b || my !== b.seq) return;
  } else b.readErr = err;
  b.busy = false; refreshBonParts();
}
async function submitBon(){

function requestCard(r){

    [t('date'), b.date, a && a.date, v => v ? dayLabel(v) : '–'],
    [t('store'), b.store, a && a.store, v => v || '–'],

    [t('card'), b.card_cents, a && a.card_cents, v => eur(v)],
    [t('cash'), b.cash_cents, a && a.cash_cents, v => eur(v)],
    [t('lbl_wallet'), b.wallet_cents, a && a.wallet_cents, v => v === null || v === undefined ? '–' : eur(v)],
    [t('runner'), b.runners, a && a.runners, names],
    [t('bar'), b.bars, a && a.bars, names]

document.addEventListener('click', async ev => {
  const el = ev.target.closest('[data-act]'); if (!el) { if (state.menu && !ev.target.closest('.menu')) { state.menu = false; render(); } return; }
  const act = el.dataset.act, f = state.form;
  switch (act){
    case 'lang': state.lang = state.lang === 'zh' ? 'de' : 'zh'; LS.set('lang', state.lang); state.menu = false; render(); break;
    case 'menu': state.menu = !state.menu; render(); break;
    case 'logout': case 'done-logout': signOut(); break;
    case 'done-more': state.done = null; render(); break;
    case 'role-pick': el.parentNode.querySelectorAll('button').forEach(b => { b.classList.toggle('on', b === el); b.setAttribute('aria-pressed', b === el); }); break;
    case 'pin-open': state.menu = false; render(); openPinDialog(); break;
    case 'pin-cancel': $('#pinDlg').close(); break;
    case 'login-pick': state.loginPick = { id: el.dataset.id, name: el.dataset.name }; state.loginErr = ''; renderLogin(); break;
    case 'login-back': state.loginPick = null; state.loginErr = ''; renderLogin(); break;
    case 'tab': state.done = null; state.tab = el.dataset.tab; LS.set('tab', state.tab); state.menu = false; if (state.tab !== 'entry') state.week = state.week || mondayOf(today()); render(); break;
    case 'store': f.store = el.dataset.store; render(); break;
    case 'chip': {
      const key = el.dataset.role === 'runner' ? 'runners' : 'bars', arr = f[key] || [], id = el.dataset.id, i = arr.indexOf(id);
      if (i >= 0) arr.splice(i, 1); else arr.push(id);
      f[key] = arr.length ? arr : null; render(); break;
    }
    case 'chip-day': { const r = el.dataset.role; f[r === 'runner' ? 'runners' : 'bars'] = dayPicks(r).slice(); render(); break; }
    case 'chip-none': f[el.dataset.role === 'runner' ? 'runners' : 'bars'] = []; render(); break;
    case 'login-admin': state.loginAdmin = !state.loginAdmin; state.loginErr = ''; renderLogin(); break;
    case 'entry-save': saveEntry(); break;
    case 'edit-cancel': state.form = blankForm(); render(); break;
    case 'entry-edit': loadIntoForm(el.dataset.id); break;
    case 'entry-del': {
      const e = state.entryCache[el.dataset.id]; let reason = null;
      if (e && e.direct){ if (!confirm(t('confirm_del'))) break; }
      else { reason = prompt(t('ask_del_reason')); if (!reason || !reason.trim()) break; }
      try { const r = await rpc('delete_entry', { ...tok(), p_entry_id: el.dataset.id, p_reason: reason });
        toast(r && r.status === 'pending' ? t('request_sent') : t('deleted')); render(); } catch(e){ toast(errText(e), true); }
      break;
    }
    case 'req-approve':
      el.disabled = true;
      try { await rpc('approve_request', { ...tok(), p_request_id: el.dataset.id }); toast(t('approved')); render(); } catch(e){ toast(errText(e), true); el.disabled = false; }
      break;
    case 'req-reject': {
      const note = prompt(t('ask_reject')); if (note === null) break;
      try { await rpc('reject_request', { ...tok(), p_request_id: el.dataset.id, p_note: note.trim() || null }); toast(t('rejected')); render(); } catch(e){ toast(errText(e), true); }
      break;
    }
    case 'staff-move': {
      const list = state.staffList.slice(), i = +el.dataset.i, j = i + (+el.dataset.dir);
      if (j < 0 || j >= list.length) break;
      [list[i], list[j]] = [list[j], list[i]];
      try { await rpc('admin_set_order', { ...tok(), p_ids: list.map(x => x.id) }); state.loginStaff = null; await loadCommon(); render(); } catch(e){ toast(errText(e), true); }
      break;
    }
    case 'staff-reset': {
      const s = state.staffEdit; if (!confirm(t('confirm_reset', { n: s.name }))) break;
      try { await rpc('admin_reset_pin', { ...tok(), p_id: s.id }); toast(t('pin_reset_done')); state.staffEdit = null; render(); } catch(e){ toast(errText(e), true); }
      break;
    }
    case 'week-prev': state.week = addDays(state.week, -7); render(); break;
    case 'week-next': if (addDays(state.week, 7) <= today()) { state.week = addDays(state.week, 7); render(); } break;
    case 'dispute': {
      const c = prompt(t('ask_comment')); if (!c || !c.trim()) break;
      try { await rpc('raise_dispute', { ...tok(), p_entry_id: el.dataset.id, p_comment: c.trim() }); toast(t('dispute_sent')); } catch(e){ toast(errText(e), true); }
      break;
    }
    case 'resolve': {
      const r = prompt(t('ask_resolution')); if (r === null) break;
      try { await rpc('resolve_dispute', { ...tok(), p_dispute_id: el.dataset.id, p_resolution: r.trim() }); toast(t('resolved')); render(); } catch(e){ toast(errText(e), true); }
      break;
    }
    case 'adj-add': {
      const amt = parseEur($('#a-amt').value);
      if (isNaN(amt) || amt <= 0) return toast(t('bad_amount'), true);
      try { await rpc('add_adjustment', { ...tok(), p_week_start: state.week, p_from: $('#a-from').value || null, p_to: $('#a-to').value || null, p_amount_cents: amt, p_reason: $('#a-reason').value });
        toast(t('adj_added')); render(); } catch(e){ toast(errText(e), true); }
      break;
    }
    case 'lock':
      try { const rv = await rpc('admin_review_list', tok()) || [];
        if (rv.some(r => mondayOf(r.date) === state.week)) { toast(t('review_first'), true); break; } } catch(e){}
      if (!confirm(t('lock_confirm'))) break;
      el.disabled = true;
      try { await rpc('lock_week', { ...tok(), p_week_start: state.week }); render(); } catch(e){ toast(errText(e), true); el.disabled = false; }
      break;
    case 'admin-sub': state.adminSub = el.dataset.sub; state.staffEdit = null; render(); break;
    case 'staff-new': state.staffEdit = {}; render(); break;
    case 'staff-edit': state.staffEdit = JSON.parse(el.dataset.json); render(); window.scrollTo(0, 0); break;
    case 'staff-cancel': state.staffEdit = null; render(); break;
    case 'staff-save': {
      const s = state.staffEdit;
      try {
        const newId = await rpc('admin_upsert_staff', { ...tok(), p_id: s.id || null, p_name: $('#s-name').value.trim(),
          p_is_active: $('#s-active').checked, p_is_kitchen: $('#s-kitchen').checked, p_is_tip_manager: $('#s-mgr').checked, p_is_admin: $('#s-admin').checked });
        const rb = document.querySelector('#s-role button.on');
        if (!$('#s-kitchen').checked && rb) await rpc('admin_set_main_role', { ...tok(), p_id: newId || s.id, p_role: rb.dataset.r });
        state.staffEdit = null; toast(t('saved')); state.loginStaff = null; await loadCommon();
        if (s.id === state.me.id){ try { state.me = await rpc('me', tok()); authStore().set('me', state.me); } catch(e){} }
        render();
      } catch(e){ toast(errText(e), true); }
      break;
    }
    case 'rate-save': {
      const k = parseFloat($('#r-k').value.replace(',', '.')), r = parseFloat($('#r-r').value.replace(',', '.')), b = parseFloat($('#r-b').value.replace(',', '.'));
      if ([k,r,b].some(isNaN)) return toast(t('bad_amount'), true);
      try { await rpc('admin_set_rate', { ...tok(), p_kitchen: k, p_runner: r, p_bar: b, p_valid_from: $('#r-from').value }); toast(t('rate_saved')); await loadCommon(); render(); }
      catch(e){ toast(errText(e), true); }
      break;
    }
    case 'report-run': runReport(); break;
    case 'view-as': state.viewAs = { id: el.dataset.id, name: el.dataset.name }; state.week = mondayOf(today()); render(); window.scrollTo(0, 0); break;
    case 'view-exit': state.viewAs = null; state.tab = 'admin'; render(); break;
    case 'entry-mode': state.entryMode = el.dataset.mode; render(); break;
    case 'bon-read': readBon(); break;
    case 'bon-retake': { const b = state.bon; b.top = null; b.bottom = null; b.read = null; b.readErr = null; b.busy = false; b.seq++; render(); window.scrollTo(0, 0); break; }
    case 'review-save': {
      const id = el.dataset.id, sv = parseSigned($('#rv-s-' + id).value), cv = parseEur($('#rv-c-' + id).value);
      if (isNaN(sv) || isNaN(cv)) return toast(t('bad_amount'), true);
      el.disabled = true;
      try { await rpc('admin_review_bon', { ...tok(), p_entry_id: id, p_schluss_cents: sv, p_card_cents: cv }); toast(t('reviewed')); render(); }
      catch(e){ toast(errText(e), true); el.disabled = false; }
      break;
    }
    case 'bon-submit': submitBon(); break;
    case 'bon-edit-save': saveBonEdit(); break;
    case 'photos': {
      try {
        const r = await callFn({ action: 'photo', entry_id: el.dataset.id });
        const dlg = $('#photoDlg');
        dlg.innerHTML = [r.photo_top, r.photo_bottom].filter(Boolean).map(u => `<img src="${esc(u)}" alt="">`).join('')
          + `<button class="btn" data-act="photo-close">${esc(t('close'))}</button>`;
        dlg.showModal();
      } catch(e){ toast(errText(e), true); }
      break;
    }
    case 'photo-close': $('#photoDlg').close(); break;
    case 'count': {
      const inp = document.getElementById('cnt-' + el.dataset.id), v = parseEur(inp && inp.value);
      if (!inp || inp.value.trim() === '' || isNaN(v)) return toast(t('bad_amount'), true);
      try { const r = await rpc('count_entry', { ...tok(), p_entry_id: el.dataset.id, p_counted_cents: v });
        toast(r.match ? t('counted_ok') : t('counted_bad'), !r.match); render(); } catch(e){ toast(errText(e), true); }
      break;
    }
    case 'bearer':
      try { await rpc('admin_set_shortage_bearer', { ...tok(), p_entry_id: el.dataset.id, p_bearer: el.dataset.b }); render(); } catch(e){ toast(errText(e), true); }
      break;
    case 'staff-ls-unbind': {
      const s = state.staffEdit; if (!confirm(t('ls_unbind_q', { n: s.name }))) break;
      try { await rpc('admin_confirm_lightspeed', { ...tok(), p_staff_id: s.id, p_confirm: false });
        toast(t('ls_unbound')); state.staffEdit = null; state.me = await rpc('me', tok()); authStore().set('me', state.me); render(); } catch(e){ toast(errText(e), true); }
      break;
    }
    case 'ls-confirm': case 'ls-unbind':
      try { await rpc('admin_confirm_lightspeed', { ...tok(), p_staff_id: el.dataset.id, p_confirm: act === 'ls-confirm' });
        state.me = await rpc('me', tok()); authStore().set('me', state.me); render(); } catch(e){ toast(errText(e), true); }
      break;
  }
});
document.addEventListener('change', async ev => {
  const el = ev.target;
  if (el.dataset && el.dataset.photo && el.files && el.files[0]){
    const b = state.bon, firstPair = !(b.top && b.bottom);
    try { b[el.dataset.photo] = await compressImage(el.files[0]); }
    catch(e){ toast(t('err_GENERIC'), true); return; }
    b.read = null; b.readErr = null; b.seq++; b.busy = false;
    render();
    if (b.top && b.bottom){
      readBon();   // 自动开始识别
      const w = $('#b-wallet');
      if (w && firstPair && !b.wallet){ w.scrollIntoView({ block: 'center' }); w.focus(); }
    }
    return;
  }
  if (el.id === 'b-ack'){ if (state.form.isBon) state.form.ack = el.checked; else state.bon.ack = el.checked; return; }
  if (el.id === 'f-date'){ state.form.date = el.value || today(); const p = $('#preview'); if (p) p.innerHTML = previewHTML(); }
  if (el.id === 'f-server'){
    state.form.server = el.value || null;
    const self = state.form.server || state.me.id;
    const flt = a => { if (!a) return a; const r = a.filter(x => x !== self); return (a.length && !r.length) ? null : r; };
    state.form.runners = flt(state.form.runners); state.form.bars = flt(state.form.bars);
    render();
  }
  if (el.dataset && el.dataset.act === 'settled'){
    try { await rpc('mark_settled', { ...tok(), p_week_start: state.week, p_staff_id: el.dataset.staff, p_done: el.checked }); }
    catch(e){ el.checked = !el.checked; toast(errText(e), true); }
  }
});
document.addEventListener('input', ev => {
  const id = ev.target.id;
  if (id === 'f-reason') state.form.reason = ev.target.value;
  if (id === 'b-wallet'){ state.bon.wallet = ev.target.value; state.bon.ack = false; refreshBonSum(); }
  if (id === 'e-wallet'){ state.form.wallet = ev.target.value; state.form.ack = false; refreshBonSum(); }
  if (id === 'f-card' || id === 'f-cash'){
    state.form[id === 'f-card' ? 'card' : 'cash'] = ev.target.value;
    const p = $('#preview'); if (p) p.innerHTML = previewHTML();
  }
});
document.addEventListener('submit', async ev => {
  const form = ev.target.dataset.form; if (!form) return;
  ev.preventDefault();
  if (form === 'login') doLogin();
  if (form === 'setpin'){
    const a = $('#sp1').value.trim(), b = $('#sp2').value.trim(), err = $('#sp-err');
    if (a !== b){ err.textContent = t('pin_mismatch'); return; }
    try {
      await rpc('set_initial_pin', { ...tok(), p_new: a });
      state.me = await rpc('me', tok()); authStore().set('me', state.me);
      await loadCommon(); toast(t('pin_changed')); render();
    } catch(e){ err.textContent = errText(e); }
  }
  if (form === 'pin'){
    if ($('#p-new').value !== $('#p-new2').value) return toast(t('pin_mismatch'), true);
    try { await rpc('change_my_pin', { ...tok(), p_old: $('#p-old').value, p_new: $('#p-new').value }); $('#pinDlg').close(); toast(t('pin_changed')); }
    catch(e){ toast(errText(e), true); }
  }
});

// ============ 共用设备：退出与空闲自动退出 ============
async function signOut(){
  const tk = state.token;
  logoutLocal(); state.loginStaff = null; state.loginAdmin = false; state.loginErr = '';
  state.bon = blankBon(); state.form = blankForm(); state.done = null; state.staffEdit = null;
  const dlg = $('#pinDlg'); if (dlg && dlg.open) dlg.close();
  hideIdleBar(); render();
  if (tk) try { await sb.rpc('logout', { p_token: tk }); } catch(e){}
}
// 员工 90 秒无操作自动退出；管理员和小费管理员 5 分钟
const idleLimit = () => { const m = state.me || {}; return (m.is_admin || m.is_tip_manager) ? 300 : 90; };
let lastAct = Date.now(), hiddenAt = null;
function hideIdleBar(){ document.querySelectorAll('.idlebar').forEach(n => n.remove()); }
function showIdleBar(n){
  let bar = document.querySelector('.idlebar');
  if (!bar){ bar = document.createElement('div'); bar.className = 'idlebar'; bar.setAttribute('role', 'status'); document.body.appendChild(bar); }
  bar.textContent = t('idle_warn', { n });
}
['pointerdown', 'keydown', 'input', 'change', 'scroll', 'touchstart'].forEach(ev =>
  document.addEventListener(ev, () => { lastAct = Date.now(); hideIdleBar(); }, { passive: true, capture: true }));
document.addEventListener('visibilitychange', () => {
  if (document.hidden){ hiddenAt = Date.now(); return; }
  const away = hiddenAt ? (Date.now() - hiddenAt) / 1000 : 0; hiddenAt = null;
  if (state.token && !state.personal && away > idleLimit()) signOut(); else lastAct = Date.now();
});
setInterval(() => {
  if (document.hidden) return;
  const idle = (Date.now() - lastAct) / 1000;
  if (!state.token){
    // 选了名字却没输 PIN：60 秒后回到名单
    if ((state.loginPick || state.loginAdmin) && idle > 60){ state.loginPick = null; state.loginAdmin = false; state.loginErr = ''; renderLogin(); }
    return;
  }
  if (state.personal || (state.bon && state.bon.busy)){ lastAct = Date.now(); return; } // 正在识别单据时不计时
  const left = idleLimit() - idle;
  if (left <= 0) signOut(); else if (left <= 15) showIdleBar(Math.ceil(left));
}, 1000);

// ============ 启动 ============
(async () => {
  if (state.token){
    try { state.me = await rpc('me', tok()); authStore().set('me', state.me); } catch(e){}
    if (state.token){
      await loadCommon();
      try { state.loginStaff = await rpc('list_login_staff'); } catch(e){}
    }
  }
  render();
})();
</script>
